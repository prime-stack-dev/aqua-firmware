version: '3.8'

services:
  mqtt-broker:
    image: eclipse-mosquitto:latest
    container_name: aqua_mosquitto
    ports:
      - "1883:1883"
    restart: always

  postgres-db:
    image: postgres:15-alpine
    container_name: aqua_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: securepassword123
      POSTGRES_DB: aquadb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build: ./backend
    container_name: aqua_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:securepassword123@postgres-db:5432/aquadb
      MQTT_BROKER_HOST: mqtt-broker
      MQTT_BROKER_PORT: 1883
    depends_on:
      - postgres-db
      - mqtt-broker
    restart: always

volumes:
  pgdata:
  