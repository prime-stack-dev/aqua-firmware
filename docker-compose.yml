# Local development stack. Copy backend/.env.example to backend/.env first.
# Ports are bound to localhost only. TLS on MQTT is added with the AWS setup.

x-backend: &backend
  build: ./backend
  env_file: ./backend/.env
  restart: unless-stopped

services:
  mqtt-broker:
    image: eclipse-mosquitto:2.0.18
    container_name: aqua_mosquitto
    # Password file is built at start so no broker secret is stored in git.
    command: >
      sh -c "touch /tmp/passwd &&
      mosquitto_passwd -b /tmp/passwd ingest \"$$MQTT_PASSWORD\" &&
      mosquitto_passwd -b /tmp/passwd simulator \"$$MQTT_SIMULATOR_PASSWORD\" &&
      chown mosquitto:mosquitto /tmp/passwd && chmod 0600 /tmp/passwd &&
      exec mosquitto -c /mosquitto/config/mosquitto.conf"
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - mosquitto-data:/mosquitto/data
    restart: unless-stopped

  postgres-db:
    image: postgres:15-alpine
    container_name: aqua_postgres
    env_file: ./backend/.env
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    <<: *backend
    container_name: aqua_migrate
    command: alembic upgrade head
    depends_on:
      postgres-db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    container_name: aqua_api
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  ingest:
    <<: *backend
    container_name: aqua_ingest
    command: python -m app.mqtt.worker
    depends_on:
      migrate:
        condition: service_completed_successfully
      mqtt-broker:
        condition: service_started

  jobs:
    <<: *backend
    container_name: aqua_jobs
    command: python -m app.jobs.worker
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  mosquitto-data:
