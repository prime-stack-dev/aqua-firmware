name: Aqua OS CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aqua
          POSTGRES_PASSWORD: aqua
          POSTGRES_DB: aqua_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aqua -d aqua_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://aqua:aqua@localhost:5432/aqua_test
      JWT_SECRET: ci-only-secret-that-is-long-enough-to-pass-validation
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Syntax Check
        run: python -m compileall backend/app

      - name: Apply Migrations
        run: |
          cd backend
          alembic upgrade head

      - name: Check Models Match Migrations
        run: |
          cd backend
          alembic check

      - name: Run Tests
        run: pytest
