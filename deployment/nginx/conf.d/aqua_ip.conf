# ==============================================================================
# Aqua OS Platform: Nginx Reverse Proxy (IP-Based Routing / No Custom Domain)
# ==============================================================================
# Traffic Routing Rules:
#   - http://<EC2_IP>/          -> Production FastAPI (localhost:8000)
#   - https://<EC2_IP>/         -> Production FastAPI (localhost:8000 with self-signed SSL)
#   - http://<EC2_IP>/dev/      -> Development FastAPI (localhost:8001)
#   - http://<EC2_IP>:8080/     -> Development FastAPI (localhost:8001)
#   - http://dev.<IP>.sslip.io  -> Development FastAPI (localhost:8001)
# ==============================================================================

upstream aqua_prod_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

upstream aqua_dev_backend {
    server 127.0.0.1:8001;
    keepalive 16;
}

# --- HTTP Server (Port 80) ---
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    client_max_body_size 25M;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Free wildcard DNS support (e.g. dev.<EC2_IP>.sslip.io)
    if ($host ~* ^dev\.) {
        rewrite ^/(.*) /dev/$1 last;
    }

    # Development API Route (/dev/ -> localhost:8001)
    location /dev/ {
        rewrite ^/dev/(.*) /$1 break;
        proxy_pass http://aqua_dev_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Production API Route (Default / -> localhost:8000)
    location / {
        proxy_pass http://aqua_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}

# --- HTTPS Server (Port 443 with Self-Signed SSL Fallback) ---
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;

    ssl_certificate /etc/ssl/aqua/selfsigned.crt;
    ssl_certificate_key /etc/ssl/aqua/selfsigned.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 25M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Development API Route (/dev/)
    location /dev/ {
        rewrite ^/dev/(.*) /$1 break;
        proxy_pass http://aqua_dev_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Production API Route (Default)
    location / {
        proxy_pass http://aqua_prod_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

# --- Dedicated Port 8080 (Direct Development Ingress) ---
server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    client_max_body_size 25M;

    location / {
        proxy_pass http://aqua_dev_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
